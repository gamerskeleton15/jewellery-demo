      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" focusable="false"><circle cx="14" cy="14" r="10" fill="none" stroke="#A6823B" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#C8A878"/></svg>
      <span>Lumine Jewels</span>
    </a>
    <nav aria-label="Primary">
      <a href="collection.html">Catalog</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="policy.html">Policy</a>
      <a href="privacy.html">Privacy</a>
    </nav>
    <a href="https://wa.me/15550142" class="whatsapp-nav" aria-label="Order on WhatsApp">WhatsApp</a>
    <button type="button" id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">☰</button>
  </header>
  <div id="mobile-menu" class="mobile-menu" role="dialog" aria-label="Mobile navigation">
    <a href="collection.html">Catalog</a>

  <main id="main">
    <section id="catalog" class="catalog" aria-label="Product catalog">
      <div class="catalog-header-wrapper">
        <h2>Our Collection</h2>
        <p class="intro">12 carefully chosen pieces. Filter by category to explore.</p>
      </div>

      <div class="filter-bar" role="group" aria-label="Filter by category">
        <button type="button" class="filter-pill active" data-filter="All" onclick="filterProducts('All', this)">All</button>
        <button type="button" class="filter-pill" data-filter="Rings" onclick="filterProducts('Rings', this)">Rings</button>
        <button type="button" class="filter-pill" data-filter="Necklaces" onclick="filterProducts('Necklaces', this)">Necklaces</button>
        <button type="button" class="filter-pill" data-filter="Earrings" onclick="filterProducts('Earrings', this)">Earrings</button>
        <button type="button" class="filter-pill" data-filter="Bracelets" onclick="filterProducts('Bracelets', this)">Bracelets</button>
      </div>

      <div class="product-grid" id="product-grid" role="list" aria-label="Products">
        <!-- Product cards will be filtered here -->
      </div>
    </section>
  </main>
  <footer class="site-footer" role="contentinfo">
    <div class="container-footer">

        <p>© <span id="year">2026</span> Lumine Jewels. All rights reserved.</p>

      <a href="#main" class="back-top" aria-label="Back to top">↑ Top</a>
    </div>

  <script src="menu.js" defer></script>
  <script src="app.js"></script>
  <script>if (document.getElementById('year')) { document.getElementById('year').textContent = new Date().getFullYear(); }</script>
